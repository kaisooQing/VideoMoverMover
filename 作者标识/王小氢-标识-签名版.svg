<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="320" height="60">
  <defs>
    <!-- 氢气渐变 -->
    <linearGradient id="hydrogenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="15%" stop-color="#0284c7"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="65%" stop-color="#22d3ee"/>
      <stop offset="82%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <!-- 左装饰线渐变 -->
    <linearGradient id="lineGradLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="1"/>
    </linearGradient>
    <!-- 右装饰线渐变 -->
    <linearGradient id="lineGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="1"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
    </linearGradient>
    <!-- 光晕滤镜 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 左侧装饰线 -->
  <line x1="20" y1="30" x2="110" y2="30" stroke="url(#lineGradLeft)" stroke-width="1" filter="url(#glow)"/>

  <!-- 右侧装饰线 -->
  <line x1="210" y1="30" x2="300" y2="30" stroke="url(#lineGradRight)" stroke-width="1" filter="url(#glow)"/>

  <!-- 王小氢 签名 -->
  <text x="160" y="37" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
        font-size="22" font-weight="700" fill="url(#hydrogenGrad)" letter-spacing="6"
        text-anchor="middle" filter="url(#glow)">王小氢</text>
</svg>
